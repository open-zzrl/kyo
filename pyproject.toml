[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyo"
version = "0.1.0"
description = "Ultra-fast 135M System-One Decision Engine for agent routing and deterministic policy guardrails"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "constructai" },
    { name = "zait-ai" }
]
keywords = [
    "system-one",
    "decision-engine",
    "agent-routing",
    "guardrails",
    "cross-encoder",
    "modernbert",
    "transformers"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0"
]

[project.urls]
Homepage = "https://huggingface.co/open-zzrl/kyo"
"Hugging Face" = "https://huggingface.co/open-zzrl/kyo"
Repository = "https://github.com/open-zzrl/kyo.git"
